<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Scanner V3</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>Inventory Scanner V3</h1>

<div class="mode">
<button id="inBtn" class="active">IN</button>
<button id="outBtn">OUT</button>
</div>

<div id="camera" class="card">
<h2>Camera</h2>
<div id="reader"></div>
</div>

<div class="card">
<label>Barcode</label>
<input id="barcode" type="text" readonly>

<label>Product Name</label>
<input id="productName" type="text" readonly>

<label>Expiry Date</label>
<select id="expiry"></select>

<label>Batch Number</label>
<input id="batchNumber" type="text" readonly>

<label>Pieces</label>
<input id="pieces" type="number">

<label>Cartons</label>
<input id="cartons" type="number">

<label>Qty (KG)</label>
<input id="qty" type="number" step="0.01">

<label>Writer</label>
<select id="writer">
<option value="">Select Writer</option>
</select>

<button id="submitBtn">Submit</button>
</div>

<div id="successMessage" style="display:none;">✅ Successfully Saved</div>
</div>
<script src="script.js"></script>
</body>
</html>
