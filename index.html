<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inventory Scanner V3</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>📦 Inventory Scanner</h1>



<!-- MODE -->

<div id="modeBanner" class="mode-banner">

🟢 CURRENT MODE : IN

</div>



<!-- IN OUT BUTTON -->


<div class="mode-buttons">


<button id="btnIn" class="mode-btn active">

🟢 IN

</button>



<button id="btnOut" class="mode-btn">

⚪ OUT

</button>


</div>






<!-- BARCODE -->


<div class="form-group">


<label>Barcode</label>


<input

type="text"

id="barcode"

placeholder="Waiting for Scan..."

readonly>


</div>







<!-- PRODUCT -->


<div class="form-group">


<label>Product</label>


<input

type="text"

id="product"

placeholder="Auto Product"

readonly>


</div>








<!-- CAMERA -->


<div class="form-group">


<label>Camera</label>


<div id="reader"></div>


</div>








<!-- BATCH -->


<div class="form-group">


<label>Batch No.</label>


<input

type="text"

id="batch"

placeholder="Enter Batch No.">


</div>









<!-- EXPIRY -->


<div class="form-group">


<label>Expiry Date</label>


<input

type="date"

id="expiry"

readonly>


</div>









<!-- PIECES -->


<div class="form-group">


<label>Pieces</label>


<input

type="number"

id="pieces"

placeholder="0">


</div>









<!-- CARTONS -->


<div class="form-group">


<label>Cartons</label>


<input

type="number"

id="cartons"

placeholder="0">


</div>









<!-- QTY -->


<div class="form-group">


<label>Qty (KG)</label>


<input

type="number"

id="qty"

placeholder="0">


</div>









<!-- WRITER -->


<div class="form-group">


<label>Written By</label>


<select id="writer">


<option value="">

Select Staff

</option>


<option>Sitong</option>


<option>Yazhen</option>


<option>JIANGHUA</option>


<option>KM</option>


<option>KY</option>


<option>Kyaw</option>


</select>


</div>









<!-- SUBMIT -->


<button id="submitBtn">


ENTER / SUBMIT


</button>





</div>







<!-- HTML5 QR CODE -->


<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>







<!-- SCRIPT -->


<script src="script.js"></script>



</body>

</html>
